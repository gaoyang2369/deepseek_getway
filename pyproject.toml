[project]
name = "lab-llm-gateway"
version = "0.1.0"
description = "Laboratory DeepSeek gateway with authoritative transactional budgets"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "redis==7.0.1",
  "openai==2.8.1",
  "httpx==0.28.1",
  "anyio==4.16.0",
  "pydantic==2.14.3",
  "cryptography==46.0.3",
  "argon2-cffi==25.1.0",
  "alembic==1.17.2",
  "python-multipart==0.0.34",
]
[dependency-groups]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "ruff==0.14.6", "playwright==1.60.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "scripts"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

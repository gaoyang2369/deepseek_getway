<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>实验室 · 模型网关</title>
    <link rel="stylesheet" href="/admin/style.css" />
  </head>
  <body>
    <div id="login-screen">
      <form id="login" class="login-card">
        <div class="brand">L / LABORATORY</div>
        <h1>模型 API 网关</h1>
        <p>统一开通，按组归因，让每一笔用量可追踪。</p>
        <label
          >管理员账号<input
            name="username"
            autocomplete="username"
            required
            value="admin" /></label
        ><label
          >密码<input
            name="password"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button>登录控制台 →</button
        ><small>仅限管理员。学生请访问学生入口领取个人 Key。</small>
      </form>
    </div>
    <div id="notice" role="status"></div>
    <div id="console" hidden>
      <aside>
        <div class="brand">L / LABORATORY</div>
        <h2>模型网关</h2>
        <p>实验室管理控制台</p>
        <nav id="nav">
          <button data-view="overview" class="selected">使用概览</button
          ><button data-view="teams">项目组</button
          ><button data-view="members">人员与密钥</button
          ><button data-view="students">学生账号</button
          ><button data-view="budgets">预算账本</button
          ><button data-view="records">记录与追溯</button
          ><button data-view="prices">模型与计价</button>
        </nav>
        <div class="aside-foot">
          单机网关 · CNY<br />统计时区 Asia/Shanghai<button id="logout">
            退出登录
          </button>
        </div>
      </aside>
      <main>
        <header>
          <div>
            <div class="eyebrow">LAB MODEL ACCESS</div>
            <h1 id="view-title">使用概览</h1>
          </div>
          <button id="refresh" class="secondary">刷新数据 ↻</button>
        </header>
        <nav
          id="record-tabs"
          class="record-tabs"
          aria-label="记录与追溯"
          hidden
        >
          <button data-view="requests">请求记录</button>
          <button data-view="rejections">拒绝记录</button>
          <button data-view="events">告警与待办</button>
          <button data-view="audit">管理审计</button>
        </nav>
        <section id="content"></section>
      </main>
    </div>
    <dialog id="modal">
      <form id="modal-form" novalidate>
        <div class="dialog-head">
          <h2 id="modal-title"></h2>
          <button type="button" id="close-modal" class="secondary">关闭</button>
        </div>
        <div id="modal-error" class="form-error" role="alert" hidden></div>
        <div id="modal-fields"></div>
        <button type="button" id="modal-submit">保存</button>
      </form>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-description"
    >
      <div class="confirm-symbol" aria-hidden="true">!</div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-description"></p>
      <div class="confirm-footer">
        <button type="button" id="confirm-cancel" class="secondary">取消</button
        ><button type="button" id="confirm-submit" class="danger-solid">
          确认删除
        </button>
      </div>
    </dialog>
    <script type="module" src="/admin/app.js"></script>
  </body>
</html>

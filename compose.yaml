name: lab-llm-gateway
services:
  postgres:
    image: postgres:17@sha256:0027bef26712baaee437a4ea48fdf3d2d2e2bc5f0d81615374408ca320f3c7e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_gateway
      POSTGRES_USER: lab_gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/database_password:/run/secrets/database_password:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab_gateway -d lab_gateway]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7@sha256:d3be87a1060455213a204d2b0a7f04d45d19a16a98e85b3c37b7c33b5f0c489e
    restart: unless-stopped
    command: [sh, -c, "cp /run/secrets/redis.conf /tmp/redis.conf && chown redis:redis /tmp/redis.conf && chmod 600 /tmp/redis.conf && exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf"]
    tmpfs: [/tmp]
    volumes:
      - ./secrets/redis.conf:/run/secrets/redis.conf:ro
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping 2>&1 | grep -q 'NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    build: .
    image: lab-llm-gateway:0.1.0
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      HMAC_KEY_FILE: /run/secrets/hmac_key
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-18081}:8080"
    networks: [backend, egress]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
  redisdata:
networks:
  backend: {internal: true}
  egress:
